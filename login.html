<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Вход администратора</title><link rel="stylesheet" href="../css/style.css"></head><body><header class="site-header"><div class="topbar"><a class="brand" href="../index.html"><span class="brand-mark">I</span>Intelligence School</a></div><div class="header-copy"><p class="eyebrow">Служебный раздел</p><h1>Вход администратора</h1></div></header><main class="wrap"><form class="card login-card" id="login-form"><h2>Авторизация</h2><p class="login-note">Демо-доступ предназначен только для локального просмотра. Для публикации подключите настоящую авторизацию.</p><label for="login">Логин</label><input id="login" required autocomplete="username"><label for="password">Пароль</label><input id="password" type="password" required autocomplete="current-password"><button type="submit">Войти</button></form></main><script>document.querySelector('#login-form').addEventListener('submit',event=>{event.preventDefault();const login=document.querySelector('#login').value,password=document.querySelector('#password').value;if(login==='admin'&&password==='admin123'){sessionStorage.setItem('schoolAdmin','true');location.href='dashboard.html'}else{document.querySelector('#password').value='';alert('Неверный логин или пароль.')}})</script></body></html>
