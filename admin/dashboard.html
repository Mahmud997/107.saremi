<!DOCTYPE html><html><head><meta charset=UTF-8><meta name=viewport content='width=device-width,initial-scale=1'><title>Dashboard</title><link rel=stylesheet href=../css/style.css><script src=../js/db.js></script></head><body><header><h1>Dashboard</h1></header><div class=wrap><div class=grid><div class=card><div class=stat id=s1></div>Заявок</div><div class=card><div class=stat id=s2></div>Учителей</div><div class=card><div class=stat id=s3></div>Новостей</div><div class=card><div class=stat id=s4></div>Вопросов</div></div><div class=card><h2>Добавить учителя</h2><input id=tn><input id=ts placeholder=Предмет><button onclick="DB.teachers.push({name:tn.value,subject:ts.value});save();render();">Сохранить</button></div><div class=card><h2>Добавить новость</h2><input id=nt><textarea id=nb></textarea><button onclick="DB.news.unshift({title:nt.value,body:nb.value});save();render();">Опубликовать</button></div><div class=card><h2>Добавить вопрос</h2><input id=q placeholder=Вопрос><input id=a1 placeholder='Ответ 1'><input id=a2 placeholder='Ответ 2'><input id=a3 placeholder='Ответ 3'><input id=a4 placeholder='Ответ 4'><select id=c><option value=0>1</option><option value=1>2</option><option value=2>3</option><option value=3>4</option></select><button onclick="DB.questions.push({q:q.value,a:[a1.value,a2.value,a3.value,a4.value],c:+c.value});save();render();">Добавить</button></div><div class=card><h2>Заявки</h2><table><tbody id=t></tbody></table></div></div><script>function render(){s1.textContent=DB.students.length;s2.textContent=DB.teachers.length;s3.textContent=DB.news.length;s4.textContent=DB.questions.length;t.innerHTML=DB.students.map(x=>`<tr><td>${x.name}</td><td>${x.grade}</td><td>${x.phone}</td></tr>`).join('')}render()</script></body></html>
