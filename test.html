<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Тест — Intelligence School</title><link rel="stylesheet" href="css/style.css"><script src="js/db.js"></script></head><body><header class="site-header"><div class="topbar"><a class="brand" href="index.html"><span class="brand-mark">I</span>Intelligence School</a></div><div class="header-copy"><p class="eyebrow">Проверка знаний</p><h1>Небольшой онлайн-тест</h1><p>Ответьте на вопросы и сразу получите результат.</p></div></header><nav class="nav"><div class="nav-inner"><a href="index.html">Главная</a><a href="admission.html">Поступление</a><a class="active" href="test.html">Тест</a><a href="teachers.html">Учителя</a><a href="news.html">Новости</a></div></nav><main class="wrap"><section class="card form-card" id="quiz"></section></main><script>let index=0,score=0;const quiz=document.querySelector('#quiz');function render(){if(!DB.questions.length){quiz.innerHTML='<h2>Тест пока не готов</h2><p>Администратор ещё не добавил вопросы.</p>';return}if(index>=DB.questions.length){quiz.innerHTML=`<p class="eyebrow" style="color:#4458d8">Результат</p><h2>${score} из ${DB.questions.length}</h2><p>${score===DB.questions.length?'Отличный результат!':'Спасибо за прохождение теста.'}</p><button onclick="location.reload()">Пройти ещё раз</button>`;return}const q=DB.questions[index];quiz.innerHTML=`<div class="quiz-progress"><span style="width:${index/DB.questions.length*100}%"></span></div><p class="eyebrow" style="color:#4458d8">Вопрос ${index+1} из ${DB.questions.length}</p><h2>${escapeHTML(q.q)}</h2><div>${q.a.map((answer,i)=>`<label class="answer"><input type="radio" name="answer" value="${i}">${escapeHTML(answer)}</label>`).join('')}</div><button id="next">Далее →</button>`;document.querySelector('#next').addEventListener('click',()=>{const selected=document.querySelector('input[name="answer"]:checked');if(!selected){notify('Выберите один вариант ответа.');return}if(Number(selected.value)===q.c)score++;index++;render()})}render()</script></body></html>
