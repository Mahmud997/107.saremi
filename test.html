<!DOCTYPE html><html><head><meta charset=UTF-8><meta name=viewport content='width=device-width,initial-scale=1'><title>Тест</title><link rel=stylesheet href=css/style.css><script src=js/db.js></script></head><body><header><h1>Онлайн тест</h1></header><div class=wrap><div class=card id=box></div></div><script>let i=0,s=0;function next(){if(i>=DB.questions.length){box.innerHTML='<h2>Балл '+s+'/'+DB.questions.length+'</h2>';return;}let q=DB.questions[i];box.innerHTML='<h3>'+q.q+'</h3>'+q.a.map((v,k)=>'<label><input type=radio name=a value='+k+'> '+v+'</label><br>').join('')+'<button onclick=ans()>Далее</button>';}function ans(){let v=document.querySelector('input[name=a]:checked');if(!v)return;if(+v.value===DB.questions[i].c)s++;i++;next()}next();</script></body></html>
