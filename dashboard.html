<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Панель управления</title><link rel="stylesheet" href="../css/style.css"><script src="../js/db.js"></script></head><body><script>window.addEventListener('DOMContentLoaded',requireAdmin)</script><header class="site-header"><div class="topbar"><a class="brand" href="../index.html"><span class="brand-mark">I</span>Intelligence School</a><button class="secondary" style="margin:0" onclick="sessionStorage.removeItem('schoolAdmin');location='login.html'">Выйти</button></div><div class="header-copy"><p class="eyebrow">Управление</p><h1>Панель администратора</h1></div></header><main class="wrap"><section class="grid" id="stats"></section><section class="admin-layout" style="margin-top:16px"><form class="card" id="teacher-form"><h2>Добавить учителя</h2><label for="teacher-name">Имя и фамилия</label><input id="teacher-name" required placeholder="Например, Иван Петров"><label for="teacher-subject">Предмет</label><input id="teacher-subject" required placeholder="Например, Физика"><button>Сохранить</button></form><form class="card" id="news-form"><h2>Опубликовать новость</h2><label for="news-title">Заголовок</label><input id="news-title" required><label for="news-body">Текст</label><textarea id="news-body" required></textarea><button>Опубликовать</button></form><form class="card wide" id="question-form"><h2>Добавить вопрос в тест</h2><label for="question">Вопрос</label><input id="question" required><div class="grid"><div><label for="a1">Вариант 1</label><input id="a1" required></div><div><label for="a2">Вариант 2</label><input id="a2" required></div><div><label for="a3">Вариант 3</label><input id="a3" required></div></div><label for="correct">Правильный ответ</label><select id="correct"><option value="0">Вариант 1</option><option value="1">Вариант 2</option><option value="2">Вариант 3</option></select><button>Добавить вопрос</button></form><section class="card wide"><h2>Заявки на поступление</h2><div class="table-wrap"><table><thead><tr><th>ФИО</th><th>Класс</th><th>Телефон</th><th>Email</th><th>Дата</th></tr></thead><tbody id="students"></tbody></table></div></section></section></main><script>const stats=document.querySelector('#stats'),students=document.querySelector('#students');function render(){stats.innerHTML=[['Заявок',DB.students.length],['Учителей',DB.teachers.length],['Новостей',DB.news.length],['Вопросов',DB.questions.length]].map(([name,count])=>`<article class="card"><div class="stat">${count}</div><p>${name}</p></article>`).join('');students.innerHTML=DB.students.length?DB.students.map(s=>`<tr><td>${escapeHTML(s.name)}</td><td>${escapeHTML(s.grade)}</td><td>${escapeHTML(s.phone)}</td><td>${escapeHTML(s.email)}</td><td>${escapeHTML(s.date||'—')}</td></tr>`).join(''):'<tr><td colspan="5" class="empty">Заявок пока нет.</td></tr>'}function bind(id,handler){document.querySelector(id).addEventListener('submit',event=>{event.preventDefault();handler(event.currentTarget);save();render();event.currentTarget.reset();notify('Сохранено.')})}bind('#teacher-form',form=>DB.teachers.push({name:form.querySelector('#teacher-name').value.trim(),subject:form.querySelector('#teacher-subject').value.trim()}));bind('#news-form',form=>DB.news.unshift({title:form.querySelector('#news-title').value.trim(),body:form.querySelector('#news-body').value.trim(),date:new Date().toLocaleDateString('ru-RU')}));bind('#question-form',form=>DB.questions.push({q:form.querySelector('#question').value.trim(),a:['#a1','#a2','#a3'].map(id=>form.querySelector(id).value.trim()),c:Number(form.querySelector('#correct').value)}));render()</script></body></html>
