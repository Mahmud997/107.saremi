<!DOCTYPE html><html lang=ru><head><meta charset=UTF-8><meta name=viewport content='width=device-width,initial-scale=1'><title>Поступление</title><link rel=stylesheet href=css/style.css><script src=js/db.js></script></head><body><header><h1>Заявка на поступление</h1></header><div class=wrap><div class=card><input id=n placeholder='ФИО'><select id=g><option>1</option><option>5</option><option>7</option><option>10</option></select><input id=p placeholder='Телефон'><input id=e placeholder=Email><button onclick="DB.students.push({name:n.value,grade:g.value,phone:p.value,email:e.value});save();alert('Готово');">Отправить</button></div></div></body></html>
