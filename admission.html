<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Поступление — Intelligence School</title><link rel="stylesheet" href="css/style.css"><script src="js/db.js"></script></head><body><header class="site-header"><div class="topbar"><a class="brand" href="index.html"><span class="brand-mark">I</span>Intelligence School</a></div><div class="header-copy"><p class="eyebrow">Поступление</p><h1>Первый шаг к обучению в школе</h1><p>Заполните форму — приёмная комиссия свяжется с вами.</p></div></header><nav class="nav"><div class="nav-inner"><a href="index.html">Главная</a><a class="active" href="admission.html">Поступление</a><a href="test.html">Тест</a><a href="teachers.html">Учителя</a><a href="news.html">Новости</a></div></nav><main class="wrap"><form class="card form-card" id="admission-form"><h2>Заявка на поступление</h2><p>Поля, отмеченные *, обязательны.</p><label for="name">ФИО ребёнка *</label><input id="name" required minlength="3" autocomplete="name" placeholder="Например, Айдана Нурланова"><label for="grade">Желаемый класс *</label><select id="grade" required><option value="" disabled selected>Выберите класс</option><option>1</option><option>5</option><option>7</option><option>10</option></select><label for="phone">Телефон родителя *</label><input id="phone" required type="tel" autocomplete="tel" placeholder="+7 700 000 00 00"><label for="email">Электронная почта *</label><input id="email" required type="email" autocomplete="email" placeholder="name@example.com"><button type="submit">Отправить заявку</button></form></main><script>document.querySelector('#admission-form').addEventListener('submit',event=>{event.preventDefault();const name=document.querySelector('#name').value.trim(),grade=document.querySelector('#grade').value,phone=document.querySelector('#phone').value.trim(),email=document.querySelector('#email').value.trim();if(!name||!grade||!phone||!email)return;DB.students.push({name,grade,phone,email,date:new Date().toLocaleDateString('ru-RU')});save();event.currentTarget.reset();notify('Заявка принята. Спасибо!')})</script></body></html>
